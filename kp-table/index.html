<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-III型Kp值查询 | 水文频率分析</title>
<link rel="icon" type="image/svg+xml" href="../icons/favicon-kp-table.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--pri:#2563eb;--pri-l:#eff6ff;--pri-d:#1d4ed8;--pri-bg:#dbeafe;--bg:#f8fafc;--card:#fff;--bdr:#e2e8f0;--txt:#0f172a;--t2:#475569;--t3:#94a3b8;--ok:#059669;--ok-bg:#ecfdf5;--ok-bdr:#a7f3d0;--input-bg:#f8fafc;--input-bdr:#cbd5e1;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;font-size:14px}
.header{background:linear-gradient(135deg,#1e3a5f,#2563eb,#3b82f6);color:#fff;padding:20px 0;text-align:center;position:relative}
.header h1{font-size:20px;font-weight:700;letter-spacing:2px}.header .logo-icon{width:36px;height:36px;vertical-align:middle;margin-right:10px;background:rgba(255,255,255,.9);border-radius:50%;padding:4px}.header p{font-size:12px;opacity:.75;margin-top:3px}
.header .back{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.7);text-decoration:none;font-size:13px;padding:4px 12px;border:1px solid rgba(255,255,255,.2);border-radius:16px}.header .back:hover{color:#fff;border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.1)}
.wrap{max-width:1100px;margin:14px auto;padding:0 14px}
.layout{display:grid;grid-template-columns:360px 1fr;gap:14px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:10px;border:1px solid var(--bdr);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-title{font-size:14px;font-weight:600;color:var(--pri);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--pri-bg)}
.sf-group{margin-bottom:12px}
.sf-label{font-size:12.5px;font-weight:500;color:var(--t2);margin-bottom:4px}
.sf-input{width:100%;padding:8px 11px;border:1.5px solid var(--input-bdr);border-radius:8px;font-size:13px;font-family:inherit;color:var(--txt);background:var(--input-bg);outline:none}
.sf-input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.1);background:#fff}
.ratio-group{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ratio-btn{padding:6px 14px;border:1.5px solid var(--bdr);border-radius:20px;font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;background:var(--card);transition:all .15s}
.ratio-btn:hover{border-color:var(--pri);color:var(--pri)}
.ratio-btn.active{border-color:var(--pri);background:var(--pri-l);color:var(--pri);font-weight:600}
.btn{padding:9px 22px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-p{background:var(--pri);color:#fff}.btn-p:hover{background:var(--pri-d);transform:translateY(-1px)}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover{background:#047857}
.btn-row{display:flex;gap:8px;justify-content:center;margin:14px 0}
.result-panel{background:var(--card);border:1px solid var(--bdr);border-radius:10px;overflow:hidden;box-shadow:0 4px 6px -1px rgba(0,0,0,.07)}
.rp-header{background:linear-gradient(135deg,#065f46,#059669);color:#fff;padding:14px 18px;text-align:center}
.rp-header h3{font-size:15px;font-weight:600}
.rp-body{padding:18px}
.attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-bottom:12px}
.attr{display:flex;align-items:baseline;gap:6px;font-size:12.5px}
.attr .k{color:var(--t3);white-space:nowrap}
.attr .v{font-weight:600;color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:12.5px;border-bottom:1.5px solid var(--bdr);padding-bottom:1px;flex:1;text-align:right}
.rp-table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
.rp-table th{background:var(--pri-l);color:var(--pri);font-weight:600;padding:7px 8px;border:1px solid var(--bdr);font-size:12px}
.rp-table td{padding:6px 8px;border:1px solid var(--bdr);text-align:center;font-size:12.5px;font-family:'JetBrains Mono',monospace}
.rp-table tr:hover td{background:#f8fafc}
.rp-table .hl td{background:var(--ok-bg)!important;font-weight:700;color:var(--ok)}
.crest-box{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:2px solid var(--ok-bdr);border-radius:10px;padding:16px;text-align:center;margin:14px 0}
.crest-box .cb-label{font-size:12px;color:var(--t2);margin-bottom:4px}
.crest-box .cb-val{font-size:24px;font-weight:700;color:var(--ok);font-family:'JetBrains Mono',monospace}
.crest-box .cb-fm{font-size:12px;color:var(--t3);margin-top:6px;font-family:'JetBrains Mono',monospace}
.collapsible{border:1px solid var(--bdr);border-radius:10px;overflow:hidden;margin-bottom:10px;background:var(--card)}
.collapse-hd{padding:11px 16px;cursor:pointer;user-select:none;font-size:13px;font-weight:500;color:var(--t2);display:flex;align-items:center;gap:8px}.collapse-hd:hover{color:var(--pri);background:var(--pri-l)}
.collapse-bd{display:none;padding:0 16px 16px}.collapse-bd.open{display:block}
.ft-wrap{overflow-x:auto;margin:10px 0}
.ft{border-collapse:collapse;font-size:11.5px;min-width:100%}
.ft th{background:var(--pri-l);color:var(--pri);font-weight:600;padding:5px 6px;border:1px solid var(--bdr);font-size:11px;white-space:nowrap;position:sticky;top:0}
.ft td{padding:4px 6px;border:1px solid var(--bdr);text-align:center;font-size:11.5px;font-family:'JetBrains Mono',monospace}
.ft tr:hover td{background:#f0f7ff}
.ft .cv-cell{background:var(--pri-bg);font-weight:600;color:var(--pri)}
.modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:1000;justify-content:center;align-items:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;width:92%;max-width:800px;max-height:85vh;overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{font-size:16px;margin-bottom:12px}
.modal .close{float:right;font-size:20px;cursor:pointer;color:var(--t3);background:none;border:none}.modal .close:hover{color:var(--txt)}
.rbox{background:#fafafa;border:1px solid var(--bdr);border-radius:8px;padding:16px;font-family:'Microsoft YaHei',sans-serif;font-size:13px;line-height:2;white-space:pre-wrap;word-break:break-all;max-height:55vh;overflow-y:auto;user-select:text}
.footer{text-align:center;padding:16px;font-size:11px;color:var(--t3)}
.hint{font-size:11px;color:var(--t3);margin-bottom:10px}
.group-row{display:grid;grid-template-columns:60px 1fr 1fr 1fr 32px;gap:8px;align-items:center;margin-bottom:8px;padding:8px 10px;background:#f8fafc;border:1px solid var(--bdr);border-radius:8px;transition:all .15s}
.group-row:hover{border-color:var(--pri);background:var(--pri-l)}
.group-row .gl{font-size:11px;font-weight:600;color:var(--t3);text-align:center}
.group-row input{width:100%;padding:6px 8px;border:1.5px solid var(--input-bdr);border-radius:6px;font-size:12px;font-family:inherit;outline:none;background:var(--card)}
.group-row input:focus{border-color:var(--pri);box-shadow:0 0 0 2px rgba(37,99,235,.08)}
.group-row input::placeholder{color:var(--t3);font-size:11px}
.group-del{background:none;border:none;color:#cbd5e1;font-size:14px;cursor:pointer;font-weight:700;padding:4px;border-radius:4px;transition:all .15s;line-height:1}.group-del:hover{color:#ef4444;background:#fef2f2}
.group-header{display:grid;grid-template-columns:60px 1fr 1fr 1fr 32px;gap:8px;padding:0 10px 6px;font-size:11px;font-weight:600;color:var(--t3)}
@media print{.header{background:#1e3a5f!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.btn,.modal-bg,.collapsible{display:none!important}}
</style>
</head>
<body>
<div class="header">
  <a class="back" href="../">← 工具集</a>
  <h1><img src="../icons/kp-table.svg" class="logo-icon">P-Ⅲ型频率曲线 Kp 值查询</h1>
  <p>皮尔逊Ⅲ型分布 · 模比系数 Kp = 1 + Cv × Φ · 水文频率分析</p>
</div>
<div class="wrap">
<div class="layout">

<div class="card" style="position:sticky;top:14px">
  <div class="card-title">📐 参数输入</div>

  <div style="font-size:13px;font-weight:600;color:var(--pri);margin-bottom:8px">① Cs/Cv 倍比</div>
  <div class="ratio-group" id="ratioGroup">
    <span class="ratio-btn" data-r="1.0">Cv</span>
    <span class="ratio-btn active" data-r="2.0">2Cv</span>
    <span class="ratio-btn" data-r="2.5">2.5Cv</span>
    <span class="ratio-btn" data-r="3.0">3Cv</span>
    <span class="ratio-btn" data-r="3.5">3.5Cv</span>
    <span class="ratio-btn" data-r="4.0">4Cv</span>
    <span class="ratio-btn" data-r="4.5">4.5Cv</span>
    <span class="ratio-btn" data-r="5.0">5Cv</span>
    <span class="ratio-btn" data-r="6.0">6Cv</span>
  </div>
  <div class="hint">💡 一般取 Cs=2~4Cv，需根据流域特性确定</div>

  <div style="font-size:13px;font-weight:600;color:var(--pri);margin-bottom:8px">② 时段参数</div>
  <div id="groupArea" style="margin-bottom:8px"></div>
  <div style="margin-bottom:14px">
    <button class="btn btn-g" style="font-size:11px;padding:4px 12px" onclick="addGroup()">＋ 添加时段</button>
  </div>

  <div style="font-size:13px;font-weight:600;color:var(--pri);margin-bottom:8px">③ 频率 <span style="color:var(--t3);font-weight:400">（留空=全部输出）</span></div>
  <div class="sf-group">
    <input class="sf-input" type="text" id="pInput" placeholder="留空输出全部，或输入如: 1,5,10,50,99">
  </div>

  <div class="btn-row">
    <button class="btn btn-p" onclick="doCalc()">🧮 查询</button>
    <button class="btn btn-ok" onclick="doExport()" id="btnExport" style="display:none">📄 计算书</button>
  </div>
</div>

<div id="resultWrap" style="display:none">
  <div class="result-panel" id="resultPanel"></div>
</div>

</div>

<div class="collapsible">
  <div class="collapse-hd" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.arrow').textContent=this.nextElementSibling.classList.contains('open')?'▼':'▶'"><span class="arrow">▶</span> 完整 Kp 值表</div>
  <div class="collapse-bd">
    <div style="margin:10px 0;display:flex;align-items:center;gap:8px">
      <span style="font-size:12px;color:var(--t2)">Cs/Cv：</span>
      <select class="sf-input" id="tableSel" onchange="renderTable()" style="width:150px">
        <option value="1.0">Cs=Cv</option><option value="2.0" selected>Cs=2Cv</option><option value="2.5">Cs=2.5Cv</option>
        <option value="3.0">Cs=3Cv</option><option value="3.5">Cs=3.5Cv</option><option value="4.0">Cs=4Cv</option>
        <option value="4.5">Cs=4.5Cv</option><option value="5.0">Cs=5Cv</option><option value="6.0">Cs=6Cv</option>
      </select>
    </div>
    <div class="ft-wrap" id="tableWrap"></div>
  </div>
</div>

<div class="footer">依据 SL 44-2006 · GB50201-2014 · 《水文手册》· 仅供参考</div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)this.classList.remove('show')">
<div class="modal">
  <button class="close" onclick="document.getElementById('modalBg').classList.remove('show')">✕</button>
  <h2>📄 Kp 查询结果</h2>
  <p style="font-size:12px;color:var(--t3);margin-bottom:8px">Ctrl+A → Ctrl+C 复制</p>
  <div class="rbox" id="rbox"></div>
  <div style="text-align:center;margin-top:12px">
    <button class="btn btn-p" onclick="copyBox()">📋 一键复制</button>
  </div>
</div>
</div>

function lerp(a, b, t) { return a + (b - a) * t; }

function lookup(ratio, cv, p) {
  var key = String(ratio);
  var table = KP[key];
  if (!table) return null;
  var rows = table.rows;
  var pCols = table.p;

  // Find cv bracket
  var lo = 0, hi = rows.length - 1;
  for (var i = 0; i < rows.length - 1; i++) {
    if (cv >= rows[i][0] && cv <= rows[i + 1][0]) { lo = i; hi = i + 1; break; }
  }
  if (cv < rows[0][0]) { lo = hi = 0; }
  if (cv > rows[rows.length - 1][0]) { lo = hi = rows.length - 1; }

  // Find p column (exact match)
  var pIdx = -1;
  for (var i = 0; i < pCols.length; i++) {
    if (Math.abs(p - pCols[i]) < 0.0001) { pIdx = i; break; }
  }

  function cvVal(colIdx) {
    if (lo === hi) return rows[lo][colIdx + 1];
    var t = (cv - rows[lo][0]) / (rows[hi][0] - rows[lo][0]);
    return lerp(rows[lo][colIdx + 1], rows[hi][colIdx + 1], t);
  }

  if (pIdx >= 0) return cvVal(pIdx);

  // Interpolate between p columns
  var pLo = 0, pHi = pCols.length - 1;
  for (var i = 0; i < pCols.length - 1; i++) {
    if (p >= pCols[i] && p <= pCols[i + 1]) { pLo = i; pHi = i + 1; break; }
  }
  var vLo = cvVal(pLo);
  var vHi = cvVal(pHi);
  var t = (p - pCols[pLo]) / (pCols[pHi] - pCols[pLo]);
  return lerp(vLo, vHi, t);
}

function fmt(v, d) { return v == null ? '—' : Number(v).toFixed(d || 4); }
function fmtP(p) {
  var pct = p;
  if (pct < 0.01) return pct.toFixed(3) + '%';
  if (pct < 0.1) return pct.toFixed(2) + '%';
  if (pct < 1) return pct.toFixed(1) + '%';
  if (pct % 1 === 0) return pct.toFixed(0) + '%';
  return pct.toFixed(1) + '%';
}

function renderGroups() {
  var h = '<div class="group-header"><span>时段</span><span>Cv *</span><span>X̄ (选填)</span><span>倍比</span><span></span></div>';
  for (var i = 0; i < groupData.length; i++) {

    h += '<div class="group-row" data-idx="' + i + '">';
    h += '<input type="text" data-f="name" placeholder="1h" value="' + g.name + '" style="text-align:center;font-weight:600">';
    h += '<input type="number" step="0.01" data-f="cv" placeholder="0.02~2.0" value="' + g.cv + '">';
    h += '<input type="number" step="any" data-f="xbar" placeholder="选填" value="' + g.xbar + '">';
    h += '<span class="gl" style="font-size:11px;color:var(--t3)">' + selectedRatio + 'Cv</span>';
    h += '<button class="group-del" onclick="delGroup(' + i + ')" title="删除">✕</button>';
    h += '</div>';
  }
  document.getElementById('groupArea').innerHTML = h;
  document.querySelectorAll('#groupArea input').forEach(function(inp) {

      var idx = parseInt(inp.closest('.group-row').getAttribute('data-idx'));
      groupData[idx][inp.getAttribute('data-f')] = inp.value;
    });
  });
}

function addGroup() {
  groupData.push({name:'', cv:'', xbar:''});
  renderGroups();
}

function delGroup(idx) {
  if (groupData.length <= 1) return;
  groupData.splice(idx, 1);
  renderGroups();
}

function getGroups() {
  document.querySelectorAll('.group-row').forEach(function(row) {
    var idx = parseInt(row.getAttribute('data-idx'));
    if (idx < groupData.length) {
      row.querySelectorAll('input').forEach(function(inp) {
        groupData[idx][inp.getAttribute('data-f')] = inp.value;
      });
    }
  });
  return groupData.filter(function(g) {
    return !isNaN(parseFloat(g.cv)) && parseFloat(g.cv) > 0;
  }).map(function(g) {
    return {name: g.name || '时段', cv: parseFloat(g.cv), xbar: parseFloat(g.xbar)};
  });
}

  var cvMax = table.rows[table.rows.length - 1][0];

  var groups = getGroups();
  if (!groups.length) { alert('请至少输入一个时段的 Cv'); return; }

  // Validate all Cv
  for (var gi = 0; gi < groups.length; gi++) {
    if (groups[gi].cv < cvMin || groups[gi].cv > cvMax) {
      alert('「' + groups[gi].name + '」Cv=' + groups[gi].cv + ' 超出范围 ' + cvMin + '~' + cvMax);
      return;
    }
  }

  // Parse P values
  var pList;
  if (!rawP) {
    pList = table.p;
  } else {
    pList = rawP.split(/[,， \t\n]+/).map(function(s) {
      s = s.replace(/%/g, '').trim();
      var n = parseFloat(s);
      return isNaN(n) ? null : n;
    }).filter(function(v) { return v !== null && v > 0 && v <= 100; });
    if (!pList.length) { alert('请输入频率值'); return; }
  }

  // Calculate for all groups
  var allResults = groups.map(function(g) {
    var cs = g.cv * parseFloat(selectedRatio);
    var results = pList.map(function(p) {
      var kp = lookup(selectedRatio, g.cv, p);
      var phi = kp != null ? (kp - 1) / g.cv : null;
      var xp = (!isNaN(g.xbar) && kp != null) ? g.xbar * kp : null;
      return { p: p, phi: phi, kp: kp, xp: xp };
    });
    return { name: g.name, cv: g.cv, cs: cs, xbar: g.xbar, results: results };
  });

  lastRes = { ratio: selectedRatio, groups: allResults, pList: pList };

  // Render
  var hasXbar = allResults.some(function(g) { return !isNaN(g.xbar); });
  var h = '<div class="rp-header"><h3>Kp 查询结果</h3></div><div class="rp-body">';
  h += '<div style="font-size:12px;color:var(--t2);margin-bottom:12px">Cs/Cv = ' + selectedRatio + '，Cv 范围 ' + cvMin + '~' + cvMax + '</div>';

  h += '<table class="rp-table"><tr><th>频率 P</th>';
  allResults.forEach(function(g) {
    h += '<th colspan="' + (hasXbar && !isNaN(g.xbar) ? '2' : '1') + '">' + g.name + '<br><span style="font-weight:400;font-size:10px">Cv=' + g.cv + '</span></th>';
  });
  h += '</tr><tr><td></td>';
  allResults.forEach(function(g) {
    h += '<th>Kp</th>';
    if (hasXbar && !isNaN(g.xbar)) h += '<th>Xp</th>';
  });
  h += '</tr>';

  for (var pi = 0; pi < pList.length; pi++) {
    h += '<tr><td>' + fmtP(pList[pi]) + '</td>';
    allResults.forEach(function(g) {
      var r = g.results[pi];
      h += '<td>' + fmt(r.kp) + '</td>';
      if (hasXbar && !isNaN(g.xbar)) h += '<td>' + fmt(r.xp, 2) + '</td>';
    });
    h += '</tr>';
  }
  h += '</table>';
  h += '</div>';

  document.getElementById('resultPanel').innerHTML = h;
  document.getElementById('resultWrap').style.display = 'block';
  document.getElementById('btnExport').style.display = 'inline-flex';
  document.getElementById('resultWrap').scrollIntoView({ behavior: 'smooth' });
}

function renderTable() {
  var ratio = document.getElementById('tableSel').value;
  var table = KP[ratio];
  if (!table) return;
  var h = '<table class="ft"><tr><th>Cv</th>';
  table.p.forEach(function(p) { h += '<th>' + fmtP(p) + '</th>'; });
  h += '</tr>';
  table.rows.forEach(function(row) {
    h += '<tr><td class="cv-cell">' + row[0] + '</td>';
    for (var i = 1; i < row.length; i++) h += '<td>' + row[i].toFixed(4) + '</td>';
    h += '</tr>';
  });
  h += '</table><div style="font-size:11px;color:var(--t3);margin-top:8px">数据来源：《水文手册》</div>';
  document.getElementById('tableWrap').innerHTML = h;
}

function doExport() {
  if (!lastRes) return;
  var r = lastRes;
  var W = 56;
  var hr = '='.repeat(W);
  var t = hr + '\n        P-Ⅲ型频率曲线 Kp 值查询结果\n\n';
  t += '  Cs/Cv = ' + r.ratio + '\n' + hr + '\n\n';
  r.groups.forEach(function(g) {
    t += '  【' + g.name + '】 Cv=' + g.cv + ', Cs=' + g.cs.toFixed(2);
    if (!isNaN(g.xbar)) t += ', X̄=' + g.xbar;
    t += '\n  ' + '-'.repeat(W - 2) + '\n';
    t += '  P          Kp';
    if (!isNaN(g.xbar)) t += '          Xp';
    t += '\n';
    g.results.forEach(function(o) {
      t += '  ' + fmtP(o.p).padEnd(10) + fmt(o.kp).padStart(10);
      if (!isNaN(g.xbar)) t += fmt(o.xp, 2).padStart(12);
      t += '\n';
    });
    t += '\n';
  });
  t += hr + '\n  Kp = 1 + Cv × Φ,  Xp = X̄ × Kp\n  数据来源：《水文手册》\n' + hr + '\n';
  document.getElementById('rbox').textContent = t;
  document.getElementById('modalBg').classList.add('show');
}
function copyBox() {
  var b = document.getElementById('rbox');
  if (navigator.clipboard) navigator.clipboard.writeText(b.textContent).then(function() { alert('✅ 已复制'); });
}

renderTable();
</script>
</body>
</html>
